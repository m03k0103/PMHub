# Track [Automation] フェーズ2: 定時巡回・サーキットブレーカー・自動コミット基盤 (Drop 135)
name: Crawl (scheduled & push)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "巡回モード"
        required: true
        default: daily
        type: choice
        options:
          - daily    # 平朝新着検知のみ (--from-ministry-news)
          - weekly   # 通常巡回（直近2年）
          - monthly  # 全期間包括走査
      dry_run:
        description: "ドライラン（コミット・pushを行わない場合はチェック）"
        required: false
        default: false
        type: boolean
      ministry:
        description: "省庁コード（任意。単一省庁のみテスト巡回する場合。例: FSA）"
        required: false
        default: ""

  # 3階層マルチスケジュール定期実行
  schedule:
    - cron: '0 21 * * 0-4'   # Daily   平朝 06:00 JST (mode: daily)
    - cron: '0 18 * * 5'     # Weekly  土曜 03:00 JST (mode: weekly)
    - cron: '0 16 1-7 * 0'   # Monthly 第1日曜 01:00 JST (mode: monthly)

permissions:
  contents: write

concurrency:
  group: crawl-automation
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 18 * * 5' && 'weekly') || (github.event.schedule == '0 16 1-7 * 0' && 'monthly') || 'daily' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      MINISTRY: ${{ github.event.inputs.ministry || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Restore SQLite master DB from JSON (Zero-Storage)
        run: python admin/db/seed_db.py

      - name: Snapshot before crawl
        run: python admin/tools/automation_report.py snapshot --out before.json

      - name: Run crawler (${{ env.MODE }})
        run: |
          mkdir -p admin/logs
          ARGS="--workers 4 --skip-download --no-llm"
          if [ -n "$MINISTRY" ]; then ARGS="$ARGS --ministry $MINISTRY"; fi
          case "$MODE" in
            daily)   CMD="python admin/crawler.py --from-ministry-news --skip-download --no-llm ${MINISTRY:+--ministry $MINISTRY}" ;;
            weekly)  CMD="python admin/crawler.py $ARGS --recent-years 2" ;;
            monthly) CMD="python admin/crawler.py $ARGS --recent-years 0" ;;
          esac
          echo "実行コマンド: $CMD"
          set -o pipefail
          $CMD 2>&1 | tee crawl.log

      - name: Export JSON (DB -> docs/data.json, admin/admin_data.json)
        run: python admin/db/export_data.py

      - name: Build diff report
        id: report
        run: |
          MODE_LABEL="${{ env.MODE }}"
          if [ "${{ env.DRY_RUN }}" = "true" ]; then MODE_LABEL="${MODE_LABEL}-dryrun"; fi
          python admin/tools/automation_report.py report \
            --before before.json --crawl-log crawl.log \
            --output report.md --github-output "$GITHUB_OUTPUT" \
            --mode "$MODE_LABEL"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run integration tests
        id: tests
        continue-on-error: true
        run: python testing/run_test_suite.py --all-layers --skip-network 2>&1 | tee test.log

      - name: Record test result in summary
        if: always()
        run: |
          {
            echo ""
            echo "## 統合テスト結果"
            echo "結果: \`${{ steps.tests.outcome }}\`"
            echo ""
            echo '```'
            tail -n 25 test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check circuit breaker status
        if: steps.report.outputs.breaker_tripped == 'true' || steps.tests.outcome != 'success'
        run: |
          echo "::error::[サーキットブレーカー発動] 異常判定またはテスト失敗を検知したため、リポジトリへの自動コミットを中止（Abort）しました。"
          {
            echo ""
            echo "> [!CAUTION]"
            echo "> **サーキットブレーカー発動**: 異常判定または統合テスト失敗を検知したため、自動コミット・pushを中断（Abort）しました。ログを確認してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        if: |
          success() &&
          env.DRY_RUN != 'true' &&
          steps.report.outputs.breaker_tripped != 'true' &&
          steps.tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data_archive.json admin/admin_data.json
          if git diff --staged --quiet; then
            echo "データに変更はありませんでした（コミット不要）。"
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "chore(data): auto crawl update [mode: ${{ env.MODE }}] ($TODAY)"
            git push origin main
            echo "✅ 新着クロール差分を main へ正常にコミット & push しました。"
          fi

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ env.MODE }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            crawl.log
            test.log
            report.md
            before.json
            docs/data.json
            admin/admin_data.json
            admin/logs/
